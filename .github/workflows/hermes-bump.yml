# Daily check for a new Hermes release. When upstream cuts one, opens a draft PR
# bumping the HERMES_REF pin in the Dockerfile, with the release notes in the PR
# body. Merging the PR triggers Railway's GitHub auto-deploy, which rebuilds the
# image against the new tag.
#
# Requires: BUMP_PR_TOKEN repo secret — a fine-grained PAT scoped to this repo
# with Contents: read/write and Pull requests: read/write. The notambourine org
# policy blocks GITHUB_TOKEN from creating PRs, so the built-in token can't open
# the bump PR.
#
# Security note: tag names and release bodies come from the upstream repo (third-
# party input). They are passed through env vars / files, never interpolated into
# run: blocks via ${{ }}.
name: hermes-release-bump

on:
  schedule:
    - cron: "23 13 * * *" # daily, after Nous's usual release window
  workflow_dispatch: {}

# Serialize runs so a manual dispatch can't race the scheduled run — both push the
# same hermes-bump/<tag> branch. Let the in-flight run finish rather than cancel.
concurrency:
  group: hermes-release-bump
  cancel-in-progress: false

# All git/API auth goes through the BUMP_PR_TOKEN PAT (org policy blocks
# GITHUB_TOKEN from creating PRs), so the built-in token gets no grants at all.
permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't bake GITHUB_TOKEN into .git/config (artipacked). Nothing here
          # pushes via git — branch and commit are created through the API.
          persist-credentials: false

      - name: Compare pinned ref to latest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
        run: |
          current="$(sed -n 's/^ARG HERMES_REF=//p' Dockerfile)"
          latest="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)"
          echo "current=${current} latest=${latest}"
          {
            echo "current=${current}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Open draft bump PR
        if: steps.check.outputs.current != steps.check.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          branch="hermes-bump/${LATEST}"

          if [ "$(gh pr list --head "${branch}" --state open --json number --jq length)" != "0" ]; then
            echo "Bump PR for ${LATEST} already open — nothing to do."
            exit 0
          fi

          # Package semver at the new tag (tags are date-based; humans think in semver).
          semver="$(curl -fsSL "https://raw.githubusercontent.com/NousResearch/hermes-agent/${LATEST}/pyproject.toml" \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"

          # A merged/closed bump PR can leave its head branch on origin (repos
          # without auto-delete). The open-PR guard above already ruled out a live
          # PR, so any hermes-bump/<tag> still here is stale — delete it, else
          # creating the ref below fails against the leftover branch.
          if gh api "repos/${REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            echo "Deleting stale remote branch ${branch} (no open PR)."
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
          fi

          # Branch + commit go through the API, not git push: the main ruleset
          # requires verified signatures, and API-created commits are signed by
          # GitHub's web-flow key. A git commit made on the runner would be
          # unsigned, leaving the bump PR unmergeable.
          head="$(git rev-parse HEAD)"
          gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="${head}"

          sed -i "s|^ARG HERMES_REF=.*|ARG HERMES_REF=${LATEST}|" Dockerfile

          # shellcheck disable=SC2016  # $vars are GraphQL variables, not shell
          gh api graphql \
            -f query='mutation($repo: String!, $branch: String!, $head: GitObjectID!, $msg: String!, $contents: Base64String!) {
              createCommitOnBranch(input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $msg},
                fileChanges: {additions: [{path: "Dockerfile", contents: $contents}]}
              }) { commit { oid } }
            }' \
            -f repo="${REPO}" \
            -f branch="${branch}" \
            -f head="${head}" \
            -f msg="chore: bump Hermes ${CURRENT} -> ${LATEST} (${semver})" \
            -f contents="$(base64 -w0 Dockerfile)"

          # shellcheck disable=SC2016  # backticks are literal markdown code spans
          {
            printf 'Bumps the pinned Hermes release: `%s` → `%s` (package %s).\n\n' "${CURRENT}" "${LATEST}" "${semver}"
            printf '**Before merging, scan the release notes for changes to CLI flags used in `start.sh`**\n'
            printf '(`hermes dashboard`, `hermes gateway run`) — a removed flag crash-loops the container.\n\n'
            printf '[Full release notes](https://github.com/NousResearch/hermes-agent/releases/tag/%s)\n\n---\n\n' "${LATEST}"
            gh api "repos/NousResearch/hermes-agent/releases/tags/${LATEST}" --jq .body | head -c 8000
          } > /tmp/pr-body.md

          gh pr create --draft \
            --head "${branch}" \
            --title "chore: bump Hermes to ${LATEST} (${semver})" \
            --body-file /tmp/pr-body.md
